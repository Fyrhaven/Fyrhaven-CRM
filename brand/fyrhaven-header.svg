<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" role="img" aria-label="Fyrhaven — header">
  <title>Fyrhaven — profile header (Gravatar 2:1, and any 3:1 cover)</title>
  <!-- The cover image for a profile page: Gravatar's header is 2:1, an X or
       YouTube cover is wider. Everything that must survive a crop sits inside the
       band y=300…700, so a 3:1 centre crop keeps the mark, the wordmark and the
       line; only the rule and the domain fall away, which is what a crop is for. -->
  <defs>
    <clipPath id="tileH"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="seaH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2233"/>
      <stop offset="1" stop-color="#0A1826"/>
    </linearGradient>
  </defs>

  <rect width="2048" height="1024" fill="url(#seaH)"/>

  <!-- the beam, fanning from the lamp and running off the right edge: the one
       warm thing on the card, and the reason the mark is where it is -->
  <polygon points="352,436 2048,250 2048,560 352,452" fill="#F2B441" opacity="0.09"/>
  <polygon points="352,440 2048,320 2048,470 352,446" fill="#F2B441" opacity="0.13"/>

  <!-- the mark -->
  <g transform="translate(160,360) scale(4.3)">
    <rect width="64" height="64" rx="14" fill="#0E2233" stroke="#1E3A52"/>
    <g clip-path="url(#tileH)">
      <polygon points="35,19.5 63,10 63,29 35,23" fill="#F2B441" opacity="0.55"/>
      <polygon points="35,20.5 63,15 63,24 35,22.5" fill="#F2B441" opacity="0.85"/>
    </g>
    <ellipse cx="31" cy="53.5" rx="17" ry="3.4" fill="#F7F9FA"/>
    <polygon points="25.6,51 29.2,27 34.8,27 38.4,51" fill="#F7F9FA"/>
    <rect x="24.6" y="24.6" width="14.8" height="2.6" rx="1.1" fill="#F7F9FA"/>
    <rect x="28.6" y="19.4" width="6.8" height="5.4" fill="#F7F9FA"/>
    <polygon points="27.4,19.4 32,14.4 36.6,19.4" fill="#F7F9FA"/>
    <polygon points="29.9,31.5 34.1,31.5 34.5,36.5 29.5,36.5" fill="#C8453B"/>
    <polygon points="29,40 35,40 35.5,45.5 28.5,45.5" fill="#C8453B"/>
  </g>

  <text x="520" y="520" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="132" font-weight="700" letter-spacing="-3" fill="#F7F9FA">fyrhaven</text>
  <text x="523" y="592" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="42" font-weight="400" fill="#A9BCC9">Your mail. Your records. Your rock.</text>
  <text x="523" y="654" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="28" font-weight="500" letter-spacing="4" fill="#F2B441">MAIL HOSTING · CRM · SELF-HOSTED</text>

  <rect x="160" y="872" width="1728" height="1" fill="#1E3A52"/>
  <text x="160" y="932" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="30" fill="#5B7382">fyrhaven.com</text>
</svg>
