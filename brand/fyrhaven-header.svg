<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 460" role="img" aria-label="Fyrhaven">
  <title>Fyrhaven — profile header</title>
  <!-- The beam comes from **outside the frame**. It has no visible start, so there
       is nothing to line up with the profile picture — which is the whole point:
       the cover is shown at wildly different widths, and a beam that began inside
       the artwork always ended up at the wrong height somewhere.

       It enters narrow at the left edge, fans out across the cover and fades
       before the far edge, so the picture reads the same at any crop. The slogan
       sits below the beam, in the dark, where white text has contrast. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2233"/>
      <stop offset="1" stop-color="#0C1E2E"/>
    </linearGradient>
    <!-- bbox starts at the apex, off-canvas, so offset 0 is never seen -->
    <linearGradient id="fan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE94A" stop-opacity="0.72"/>
      <stop offset="0.2" stop-color="#FFE94A" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#FFE066" stop-opacity="0.30"/>
      <stop offset="0.85" stop-color="#FFE07A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8D6" stop-opacity="0.95"/>
      <stop offset="0.2" stop-color="#FFF4A8" stop-opacity="0.82"/>
      <stop offset="0.45" stop-color="#FFE04A" stop-opacity="0.34"/>
      <stop offset="0.8" stop-color="#FFE07A" stop-opacity="0"/>
    </linearGradient>
    <filter id="halo" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tight" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="2048" height="460" fill="url(#field)"/>

  <!-- apex just off-canvas at (-140, 206): a sliver at the left edge, a wide fan at the right -->
  <g filter="url(#halo)">
    <polygon points="-140,206 2048,18 2048,392" fill="url(#fan)"/>
  </g>
  <g filter="url(#tight)">
    <polygon points="-140,206 2048,96 2048,306" fill="url(#core)"/>
  </g>

  <text x="780" y="344" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="36" font-weight="400" fill="#F7F9FA">Your mail. Your records. Your rock.</text>
</svg>
