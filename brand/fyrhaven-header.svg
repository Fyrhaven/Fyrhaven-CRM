<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" role="img" aria-label="Fyrhaven — profile header">
  <title>Fyrhaven — profile header (Gravatar cover)</title>
  <!-- A cover, not a card. Two things the first version got wrong, both visible
       only once it was on a real profile:

       1. The profile picture sits *on top of* the cover's left side, so a mark
          drawn there is a second lighthouse behind the first one.
       2. Gravatar shows the cover as a wide band, not at 2:1, so anything near
          the top or bottom edge is cropped away.

       So: no mark in the artwork — the avatar is the mark — and the beam leaves
       the avatar's right edge and runs off the canvas, which is what makes the
       two read as one picture. All the text lives between y=380 and y=740 and
       right of x=560: outside the avatar, inside any wide crop. -->
  <defs>
    <linearGradient id="seaP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2233"/>
      <stop offset="1" stop-color="#0A1826"/>
    </linearGradient>
  </defs>

  <rect width="2048" height="1024" fill="url(#seaP)"/>

  <!-- the beam, out of the avatar and off the right edge -->
  <polygon points="486,468 2048,330 2048,690 486,500" fill="#F2B441" opacity="0.09"/>
  <polygon points="486,474 2048,404 2048,608 486,494" fill="#F2B441" opacity="0.13"/>

  <text x="620" y="492" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="128" font-weight="700" letter-spacing="-3" fill="#F7F9FA">fyrhaven</text>
  <text x="623" y="562" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="38" font-weight="400" fill="#A9BCC9">Your mail. Your records. Your rock.</text>
  <text x="623" y="618" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="25" font-weight="500" letter-spacing="4" fill="#F2B441">MAIL HOSTING · CRM · SELF-HOSTED</text>
</svg>
