<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 460" role="img" aria-label="Fyrhaven — profile header">
  <title>Fyrhaven — profile header (beam study)</title>
  <!-- Beam only, for now. The wordmark, tagline and capability line were taken
       out on purpose: settle the light first, then put the words back around it.

       The beam is a **fan**: narrow where it leaves the lamp, wider at the far
       edge, which is what light does. Earlier versions had it the other way up —
       broad at the lamp and thinning out — and read as a band of colour rather
       than a beam.

       Its left edge starts at x=200, well behind the profile picture, so the place
       where it begins is never visible. It sits at ~60% of the height, which is
       where the lantern is on a real profile: the avatar is not centred on the
       band but pushed down, its centre about 63% of the way down the cover. -->
  <defs>
    <!-- flat: the avatar's own tile is #0E2233, so a strong gradient shows its edge -->
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2233"/>
      <stop offset="1" stop-color="#0C1E2E"/>
    </linearGradient>
    <!-- yellow, not amber: amber at low alpha over near-black goes brown -->
    <linearGradient id="fan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD400" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FFD83D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFE07A" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE21A" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFD400" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFE07A" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF0B8" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#FFD400" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFD400" stop-opacity="0"/>
    </radialGradient>
    <!-- light has no edge -->
    <filter id="soft" x="-15%" y="-80%" width="130%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tight" x="-15%" y="-120%" width="130%" height="340%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="2048" height="460" fill="url(#field)"/>

  <g filter="url(#soft)">
    <polygon points="200,224 2048,168 2048,348 200,328" fill="url(#fan)"/>
  </g>
  <g filter="url(#tight)">
    <polygon points="200,246 2048,204 2048,312 200,308" fill="url(#core)"/>
    <ellipse cx="470" cy="278" rx="150" ry="70" fill="url(#lamp)"/>
  </g>
</svg>
