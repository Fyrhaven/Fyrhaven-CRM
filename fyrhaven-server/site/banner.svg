<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Fyrhaven">
  <title>Fyrhaven — banner / Open Graph card</title>
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2233"/>
      <stop offset="1" stop-color="#0A1826"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sea)"/>

  <!-- the beam, running off the right edge: the one warm thing on the card -->
  <polygon points="470,232 1200,120 1200,360 470,272" fill="#F2B441" opacity="0.10"/>
  <polygon points="470,238 1200,170 1200,300 470,266" fill="#F2B441" opacity="0.14"/>

  <!-- the mark, at banner scale -->
  <g transform="translate(96,170) scale(2.6)">
    <rect width="64" height="64" rx="14" fill="#0E2233" stroke="#1E3A52"/>
    <g clip-path="url(#tile)">
      <polygon points="35,19.5 63,10 63,29 35,23" fill="#F2B441" opacity="0.55"/>
      <polygon points="35,20.5 63,15 63,24 35,22.5" fill="#F2B441" opacity="0.85"/>
    </g>
    <ellipse cx="31" cy="53.5" rx="17" ry="3.4" fill="#F7F9FA"/>
    <polygon points="25.6,51 29.2,27 34.8,27 38.4,51" fill="#F7F9FA"/>
    <rect x="24.6" y="24.6" width="14.8" height="2.6" rx="1.1" fill="#F7F9FA"/>
    <rect x="28.6" y="19.4" width="6.8" height="5.4" fill="#F7F9FA"/>
    <polygon points="27.4,19.4 32,14.4 36.6,19.4" fill="#F7F9FA"/>
    <polygon points="29.9,31.5 34.1,31.5 34.5,36.5 29.5,36.5" fill="#C8453B"/>
    <polygon points="29,40 35,40 35.5,45.5 28.5,45.5" fill="#C8453B"/>
  </g>

  <text x="450" y="288" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-2" fill="#F7F9FA">fyrhaven</text>
  <text x="452" y="352" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="30" font-weight="400" fill="#A9BCC9">Your mail. Your records. Your rock.</text>
  <text x="452" y="404" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="500" letter-spacing="2" fill="#F2B441">MAIL HOSTING · CRM · SELF-HOSTED</text>

  <rect x="96" y="524" width="1008" height="1" fill="#1E3A52"/>
  <text x="96" y="566" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="20" fill="#5B7382">fyrhaven.com</text>
</svg>
