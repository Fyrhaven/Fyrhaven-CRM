# The Fyrhaven record server behind a reverse proxy you **already** run —
# nginx-proxy-manager, Traefik, Caddy somewhere else.
# `docker compose -f docker-compose.host.yml up -d` (from this folder, with a
# `.env` next to it).
#
# Same service as `docker-compose.yml`, minus its own Caddy: nothing is
# published on the host, the server joins the network the proxy already uses, and
# TLS stays where it already is. Point a proxy host at
#
#     fyrhaven-server:8080
#
# so the server is never reachable from the internet except through that proxy —
# there is no plaintext hop to find, and no second certificate to renew.
#
# Choose the network with `PROXY_NETWORK` when your proxy is on a differently
# named one (`docker network ls`).
name: fyrhaven-server

services:
  store:
    build: .
    image: fyrhaven-server:1.0.0
    container_name: fyrhaven-server
    restart: unless-stopped
    environment:
      # A token IS a workspace: `token=workspace,token=workspace`.
      STORE_TOKENS: ${STORE_TOKENS:?set STORE_TOKENS in .env — one token per workspace}
      # Wraps every workspace's data key. Lose it and the database is unreadable.
      STORE_MASTER_KEY: ${STORE_MASTER_KEY:?set STORE_MASTER_KEY in .env — 32 bytes, base64}
      # The licence Fyrhaven signed for this installation. Checked offline.
      FYRHAVEN_LICENCE: ${FYRHAVEN_LICENCE:?set FYRHAVEN_LICENCE in .env — from your Fyrhaven order}
      FYRHAVEN_LICENCE_PUBLIC: ${FYRHAVEN_LICENCE_PUBLIC:-}
      PORT: "8080"
      STORE_DB: /data/store.sqlite
      # Where a workspace's bytes live (#158). Empty means /v1/admin answers
      # 503 and every workspace stays on SQLite.
      STORE_ADMIN_TOKEN: ${STORE_ADMIN_TOKEN:-}
      ALLOW_QUERY_TOKEN: ${ALLOW_QUERY_TOKEN:-}
      # Blob storage (#158). All three of R2_S3_API / R2_ACCESS_KEY_ID /
      # R2_SECRET_ACCESS_KEY must be set or the bucket is off and every workspace
      # stays on SQLite. They belong here, not only in `.env`: a variable that is
      # in `.env` but not in this block never reaches the container, and the
      # adapter would report "not configured" inside Docker while working on the
      # host. `R2_S3_API` already ends in the bucket path.
      R2_S3_API: ${R2_S3_API:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    volumes:
      - store-data:/data
    networks:
      - proxy
    # No `ports:` on purpose. The proxy reaches it by name on the network.

volumes:
  store-data:

networks:
  proxy:
    external: true
    # Whatever your proxy is attached to: `opt_default`, `npm_default`, `traefik`…
    name: ${PROXY_NETWORK:-opt_default}
