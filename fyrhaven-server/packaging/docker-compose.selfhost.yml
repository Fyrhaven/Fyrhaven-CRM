# Fyrhaven record server, self-hosted.
#
#   cp .env.example .env      # then fill in three values
#   docker compose up -d
#
# The store is published on loopback only: put your own proxy (nginx, Caddy,
# Traefik) in front of it and give it a certificate. There is no plaintext hop to
# find from the internet, and no certificate for this container to renew.
name: fyrhaven-server

services:
  store:
    build: .
    image: fyrhaven-server:1.0.0
    container_name: fyrhaven-server
    restart: unless-stopped
    environment:
      # A token IS a workspace: `token=workspace,token=workspace`. The plugin's
      # "workspace token" is one of these.
      STORE_TOKENS: ${STORE_TOKENS:?set STORE_TOKENS in .env — one token per workspace}
      # Wraps every workspace's data key. Lose it and the database is unreadable.
      STORE_MASTER_KEY: ${STORE_MASTER_KEY:?set STORE_MASTER_KEY in .env — 32 bytes, base64}
      # The licence Fyrhaven signed for this installation. Without it the
      # server refuses to start — that is the whole lock, and it is checked
      # offline, so this server never calls home.
      FYRHAVEN_LICENCE: ${FYRHAVEN_LICENCE:?set FYRHAVEN_LICENCE in .env — from your Fyrhaven order}
      PORT: "8080"
      STORE_DB: /data/store.sqlite
      # Optional: an S3-compatible bucket for the records instead of SQLite.
      # R2_S3_API already ends in the bucket path.
      R2_S3_API: ${R2_S3_API:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    volumes:
      - ./data:/data
    ports:
      # loopback only, on purpose: your proxy terminates TLS and faces the world
      - "127.0.0.1:8080:8080"
